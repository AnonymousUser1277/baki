<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BAKI HYBRID: THE COMPLETE WARRIOR BLUEPRINT</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗿</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@600&display=swap" rel="stylesheet">
  <style>
    html, body, iframe { margin: 0; padding: 0; width: 100%; height: 100%; border: 0; background: #0f0a12; overflow: hidden; font-family: Barlow, sans-serif; color: #f4ece1; }
    #gate { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: radial-gradient(ellipse at 50% -10%, #431123 0, #0f0a12 65%); padding: 20px; text-align: center; }
    h1 { font: 400 54px/1 Anton, Impact, sans-serif; letter-spacing: 2px; color: #ee2b45; margin: 0 0 8px; text-transform: uppercase; }
    p { color: #a79cb4; margin: 0 0 20px; font-size: 16px; }
    input { background: #1a1220; border: 1px solid #38273f; color: #f4ece1; padding: 12px 18px; border-radius: 999px; font-size: 16px; text-align: center; width: 240px; outline: none; margin-bottom: 12px; }
    input:focus { border-color: #ff9a3c; }
    button { background: #ee2b45; color: #fff; border: 0; padding: 11px 28px; border-radius: 999px; font-weight: 600; font-size: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(238, 43, 69, 0.4); }
  </style>
</head>
<body>
  <div id="gate">
    <h1>🗿 BAKI VAULT</h1>
    <p>Enter your secret passkey once to unlock this device forever</p>
    <form id="f">
      <input type="password" id="k" placeholder="Secret Passkey..." required autofocus><br>
      <button type="submit">🔓 Unlock Blueprint</button>
    </form>
  </div>
  <iframe id="app" style="display:none" allow="autoplay"></iframe>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby5_s43J1EpG1ds-HcW9ZnoBK2rGQolvrDq-sgb1yYSBjsm9NwCKJmuVMZCe90ACACR/exec";

    function launch(key) {
      document.getElementById('gate').style.display = 'none';
      const frame = document.getElementById('app');
      frame.style.display = 'block';
      frame.src = GAS_URL + "?key=" + encodeURIComponent(key);
    }

    // Auto-unlock instantly if you already entered your passkey on this Phone/PC
    const savedKey = localStorage.getItem('baki_vault_key');
    if (savedKey) launch(savedKey);

    document.getElementById('f').addEventListener('submit', e => {
      e.preventDefault();
      const val = document.getElementById('k').value.trim();
      if (val) {
        localStorage.setItem('baki_vault_key', val);
        launch(val);
      }
    });

    // If a wrong passkey was typed, allow instant reset
    window.addEventListener('message', e => {
      if (e.data === 'baki_reset_key') {
        localStorage.removeItem('baki_vault_key');
        document.getElementById('app').style.display = 'none';
        document.getElementById('gate').style.display = 'flex';
        document.getElementById('k').value = '';
      }
    });
  </script>
</body>
</html>
